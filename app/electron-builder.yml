appId: com.jan3.haven-proxy
productName: Haven Proxy
directories:
  # Not app/ itself: scripts/prepack.mjs esbuilds everything into .bundle first,
  # so the package holds four files instead of a 24MB node_modules tree. Always
  # build via `npm run dist`, which runs that step first.
  #
  # This only stays true because haven-proxy is a devDependency of the app — the
  # module collector ignores dev deps, and if it ever collected that file:..
  # symlink it would dereference the whole repo into the package (SEA binary,
  # nested builds, .env). build/after-pack.cjs fails the build if that happens.
  app: .bundle
  output: dist
asar: true
# No i18n — drop the other 54 Chromium locale packs (~46MB).
electronLanguages: ["en-US"]
compression: maximum
# Deletes Chromium's 20MB LICENSES.chromium.html; see README for attribution.
afterPack: ./build/after-pack.cjs
win:
  # NSIS, not portable — portable exes extract to %TEMP%, so the launch-at-login
  # registry entry would point at a temp path.
  target: nsis
  artifactName: HavenProxy-Setup-${version}.${ext}
nsis:
  # Assisted (multi-page) installer: custom pages like the OpenCode checkbox in
  # build/installer.nsh only exist in electron-builder's assistedInstaller.nsh.
  oneClick: false
  perMachine: false # per-user install, no UAC prompt
  include: build/installer.nsh
mac:
  target: dmg
  artifactName: HavenProxy-${version}-${arch}.${ext}
  extendInfo:
    LSUIElement: true # menu-bar-only app, no dock icon
linux:
  target: AppImage
  category: Utility
  artifactName: HavenProxy-${version}.${ext}
