<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Haven Proxy — Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        color: #222;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.hint { font-size: 12px; color: #666; margin: 0 0 14px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 13px;
        font-family: ui-monospace, monospace;
        border: 1px solid #bbb;
        border-radius: 6px;
      }
      button {
        margin-top: 12px;
        padding: 7px 18px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        background: #2e90fa;
        color: white;
        cursor: pointer;
      }
      button:disabled { background: #9cc7f5; cursor: default; }
      #cancel { background: #eee; color: #333; margin-left: 8px; }
      #status { font-size: 12px; margin-top: 10px; min-height: 32px; }
      #status.error { color: #c0392b; }
      #status.ok { color: #1e7d32; }
      #status.confirm { color: #a15c00; }
      #status code { font-family: ui-monospace, monospace; }
      details {
        margin-top: 16px;
        border-top: 1px solid #eee;
        padding-top: 10px;
      }
      summary { font-size: 12px; color: #666; cursor: pointer; }
      details .body { margin-top: 10px; }
      p.warning { font-size: 11px; color: #a15c00; margin: 0 0 8px; }
      .url-row { display: flex; gap: 6px; }
      .url-row input { flex: 1; }
      #reset-url {
        margin-top: 0;
        padding: 7px 10px;
        font-size: 12px;
        background: #eee;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>Haven Proxy settings</h1>
    <p class="hint">Stored locally in ~/.haven-proxy/config.json — shared with the haven-proxy CLI.</p>
    <input id="key" type="password" placeholder="hvn1_…" autofocus />
    <details id="advanced">
      <summary>Advanced settings</summary>
      <div class="body">
        <p class="warning">Avoid changing this setting — it overrides the Haven backend origin.</p>
        <div class="url-row">
          <input id="base-url" type="text" placeholder="https://…" spellcheck="false" />
          <button id="reset-url" type="button">Reset to default</button>
        </div>
      </div>
    </details>
    <button id="save">Save &amp; verify</button>
    <button id="cancel" type="button" hidden>Cancel</button>
    <p id="status"></p>
    <script>
      const keyInput = document.getElementById("key");
      const baseUrlInput = document.getElementById("base-url");
      const resetUrlButton = document.getElementById("reset-url");
      const button = document.getElementById("save");
      const cancelButton = document.getElementById("cancel");
      const status = document.getElementById("status");
      let defaultBaseURL = "";
      // Sticky across a re-submit: once the key replacement is confirmed, a later
      // "Save anyway" for an invalid key must not ask about it again.
      let confirmReplace = false;

      window.haven.getSettings().then((settings) => {
        baseUrlInput.value = settings.baseURL;
        defaultBaseURL = settings.defaultBaseURL;
        if (settings.redactedKey) {
          keyInput.placeholder = `${settings.redactedKey} — leave blank to keep`;
        }
      });

      resetUrlButton.addEventListener("click", () => {
        baseUrlInput.value = defaultBaseURL;
      });

      function monospace(text) {
        const el = document.createElement("code");
        el.textContent = text;
        return el;
      }

      function describeResult(result) {
        if (result.warning) return result.warning;
        if (result.balance !== null) return `Balance $${result.balance.toFixed(2)}. Proxy is running.`;
        if (result.emptyBalance) return "Key valid (balance $0.00 — top up before sending requests).";
        return "Saved. Proxy is running.";
      }

      // Idle, or waiting on a deliberate second click. `next` is what that click does.
      function setPrompt({ label, next } = {}) {
        button.textContent = label || "Save & verify";
        button.disabled = false;
        cancelButton.hidden = !next;
        button.onclick = next || (() => submit());
      }

      async function submit(opts = {}) {
        button.disabled = true;
        cancelButton.hidden = true;
        status.className = "";
        status.textContent = "Verifying…";
        const result = await window.haven.saveSettings({
          apiKey: keyInput.value,
          baseURL: baseUrlInput.value,
          confirmReplace,
          force: Boolean(opts.force),
        });

        if (result.confirm) {
          status.className = "confirm";
          // Nodes, not innerHTML: the redacted keys are user input and this page
          // runs with 'unsafe-inline' script-src plus the IPC bridge.
          status.replaceChildren(
            document.createTextNode("Replace the saved key "),
            monospace(result.confirm.from),
            document.createTextNode(" with "),
            monospace(result.confirm.to),
            document.createTextNode("?"),
          );
          setPrompt({ label: "Replace", next: () => { confirmReplace = true; return submit(opts); } });
          return;
        }
        if (!result.ok) {
          status.className = "error";
          status.textContent = result.error;
          setPrompt(result.canForce ? { label: "Save anyway", next: () => submit({ force: true }) } : {});
          return;
        }
        status.className = "ok";
        status.textContent = describeResult(result);
        setTimeout(() => window.haven.closeWindow(), 1800);
      }

      cancelButton.addEventListener("click", () => {
        confirmReplace = false;
        status.className = "";
        status.textContent = "";
        setPrompt();
      });
      const submitOnEnter = (e) => {
        if (e.key === "Enter" && !button.disabled) button.onclick();
      };
      keyInput.addEventListener("keydown", submitOnEnter);
      baseUrlInput.addEventListener("keydown", submitOnEnter);
      setPrompt();
    </script>
  </body>
</html>
